name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public files
        run: python tools/check_public_tree.py
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test protocol and adapters
        run: python -m pytest
      - name: Run interruption example
        run: python -m retire_serving.demo
